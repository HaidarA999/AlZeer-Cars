<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | لوحة تحكم المصري كارز</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="login-card">
      <div class="login-logo">
        <strong>المصري كارز</strong>
        <span>لوحة التحكم</span>
      </div>
      <h1>تسجيل دخول الإدارة</h1>
      <p>هاي الصفحة للإدارة بس — ما تشاركها مع حدا</p>

      <div class="error-msg" id="errorMsg">اسم المستخدم أو كلمة السر غلط.</div>

      <form id="loginForm">
        <div class="form-field">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-field">
          <label for="password">كلمة السر</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="login-btn">دخول</button>
      </form>

      <div class="login-note">
        محمية من طرف السيرفر — ما فيها حدا يفوت عاللوحة أو يعدّل بيانات
        من دون ما يسجل دخول بحساب مسموحله.
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
